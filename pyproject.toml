[tool.poetry]
name = "acteo"
version = "0.1.0"
description = "Trail-cam image sequence classifier GUI"
authors = [""]
license = "GPL-3.0-or-later"
packages = [{ include = "acteo", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
PySide6 = ">=6.5"
Pillow = ">=9.0"
python-dateutil = ">=2.8"

[tool.poetry.scripts]
acteo = "acteo.main:main"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
exclude = [".venv", "dist", "build", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C", "N", "B", "B9"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
